<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Department Login · CivicConnect</title><link rel="stylesheet" href="css/style.css">
</head><body><header class="nav" id="nav"></header><main><div id="flash"></div>
<div class="card center"><h1>Department Login</h1><form id="f"><label for="email">Official email</label><input type="email" id="email" autocomplete="username" autofocus>
<label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password"><p><button class="btn" id="b">Login</button></p></form>
<p class="small">New department? Create an account: <a href="dept-register.html">Register your department</a> · <a href="login.html">Citizen login</a> · <a href="admin-login.html">Admin login</a></p></div></main>
<script src="js/app.js"></script><script>
(async()=>{ if(!(await boot(null))) return; if(ME) return location.href=HOME[ME.role];
showRegisteredNotice();
authForm({form:'f',button:'b',path:'/dept/login',busy:'Logging in…',
 collect:()=>({email:$('email').value.trim(),password:$('pw').value}),
 validate:d=>{const e=[]; if(!EMAIL_RE.test(d.email)) e.push('Enter a valid email address.'); if(!d.password) e.push('Password is required.'); return e},
 success:d=>'Login successful. Redirecting…', redirect:d=>HOME[d.role]});
})();
</script></body></html>
